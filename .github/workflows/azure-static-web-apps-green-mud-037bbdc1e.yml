name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: |
          npm install
          npm install -g @angular/cli
          npx playwright install --with-deps
        
      - name: Compile TypeScript and Build
        run: ng build

      # Deploy to staging slot for testing
      - name: Deploy to Staging Slot
        id: staging_deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MUD_037BBDC1E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist/movie-tracker-app/browser'
          api_location: ''
          output_location: ''
          deployment_environment: 'staging'

      - name: Wait for staging deployment
        run: sleep 60

      - name: Verify staging URL is available
        run: |
          echo "Staging URL: ${{ steps.staging_deploy.outputs.static_web_app_url }}"
          curl -I "${{ steps.staging_deploy.outputs.static_web_app_url }}" || echo "URL not ready yet"

      - name: Run E2E Tests on Staging
        id: e2e_tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.staging_deploy.outputs.static_web_app_url }}
        run: npm run e2e:ci
        continue-on-error: true

      - name: Delete Staging Slot
        if: always()
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MUD_037BBDC1E }}
          action: 'close'
          deployment_environment: 'staging'

      - name: Check Test Results
        if: steps.e2e_tests.outcome == 'failure'
        run: |
          echo "E2E tests failed. Deployment to production cancelled."
          exit 1

      - name: Deploy to Production
        id: production_deploy
        if: steps.e2e_tests.outcome == 'success'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MUD_037BBDC1E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist/movie-tracker-app/browser'
          api_location: ''
          output_location: ''

      - name: Production Deployment Success
        if: steps.e2e_tests.outcome == 'success'
        run: |
          echo "✅ E2E tests passed! Successfully deployed to production."
          echo "Production URL: ${{ steps.production_deploy.outputs.static_web_app_url }}"
          
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MUD_037BBDC1E }}
          action: "close"
