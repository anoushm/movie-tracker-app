name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npx playwright install --with-deps

      - name: Build app
        run: npm run build

      # Deploy to staging slot for testing
      - name: Deploy to Staging Slot
        id: staging_deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MUD_037BBDC1E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist/movie-tracker-app/browser'
          api_location: ''
          output_location: ''
          skip_app_build: true
          deployment_environment: 'staging'

      - name: Wait for staging deployment
        run: sleep 60

      - name: Resolve staging URL
        id: resolve_url
        run: |
          RAW_URL='${{ steps.staging_deploy.outputs.static_web_app_url }}'
          # Azure SWA action still emits the deprecated region-in-hostname form
          # (e.g. .westus2.5.azurestaticapps.net) which no longer resolves. Strip
          # the region segment to get the current-format hostname.
          FIXED_URL=$(echo "$RAW_URL" | sed -E 's#\.[a-z0-9-]+\.5\.azurestaticapps\.net#.5.azurestaticapps.net#')
          echo "Raw URL:   $RAW_URL"
          echo "Fixed URL: $FIXED_URL"
          echo "url=$FIXED_URL" >> "$GITHUB_OUTPUT"

      - name: Verify staging URL is available
        run: |
          echo "Staging URL: ${{ steps.resolve_url.outputs.url }}"
          curl -I "${{ steps.resolve_url.outputs.url }}" || echo "URL not ready yet"

      - name: Additional wait for app initialization
        run: sleep 30

      - name: Run E2E Tests on Staging
        id: e2e_tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.resolve_url.outputs.url }}
        run: npm run e2e:ci
        continue-on-error: true

      - name: Check Test Results
        if: steps.e2e_tests.outcome == 'failure'
        run: |
          echo "❌ E2E tests failed on staging environment"
          echo "Staging URL: ${{ steps.staging_deploy.outputs.static_web_app_url }}"
          echo "Production deployment cancelled - fix the issues and try again"
          exit 1

      - name: Tests Passed - Ready for Production
        id: ready_for_production
        if: steps.e2e_tests.outcome == 'success'
        run: |
          echo "✅ E2E tests passed on staging environment"
          echo "Tested staging URL: ${{ steps.staging_deploy.outputs.static_web_app_url }}"
          echo "Deploying the same tested build to production..."

      - name: Deploy to Production
        id: production_deploy
        if: steps.e2e_tests.outcome == 'success'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MUD_037BBDC1E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist/movie-tracker-app/browser'
          api_location: ''
          output_location: ''
          skip_app_build: true

      - name: Production Deployment Success
        if: steps.e2e_tests.outcome == 'success' && steps.production_deploy.outcome == 'success'
        run: |
          echo "✅ Production deployment completed successfully!"
          echo "✅ Tested build is now live in production"
          echo "Production URL: ${{ steps.production_deploy.outputs.static_web_app_url }}"
          echo "Staging environment left available for reference: ${{ steps.staging_deploy.outputs.static_web_app_url }}"
          
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MUD_037BBDC1E }}
          action: "close"
