<div id="wrapper"
     class="toggled">

        <header class="flex items-center justify-between px-4 py-3 bg-white shadow mobile-header">
          <div class="flex-shrink-0">
            <button (click)="toggleSideMenu($event)" 
                    id="burgerButton" 
                    data-testid="burger-menu-button"
                    class="flex flex-col justify-center items-center w-8 h-8 space-y-1 focus:outline-none">
              <span class="block w-6 h-0.5 bg-gray-300"></span>
              <span class="block w-6 h-0.5 bg-gray-300"></span>
              <span class="block w-6 h-0.5 bg-gray-300"></span>
            </button>
          </div>

          <div class="flex-grow text-center">
            <a [routerLink]="['/movies', 'popular']" data-testid="logo-link">
                <picture style="text-align:center;" srcset="/assets/logo.svg"
                         media="(min-width: 80em)">
                    <img class="logo-img"
                         src="/assets/logo.svg"
                         title="Movies Tracker"
                         alt="MoviesTracker"
                         data-testid="logo-image"
                         width="70"
                         style="display:inline-block"
                         height="100" />
                </picture>
            </a>
          </div>

          <div class="flex-shrink-0">
              <!-- Chat Icon -->
              <button class="text-white rounded-lg" 
                      [routerLink]="['/movies', 'chatbot']"
                      data-testid="chatbot-button">
  <span class="w-10 h-10 inline-block" data-testid="chat-icon">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
      <g>
        <!-- Chat bubble body -->
        <path fill="#efa21b" stroke="#fff" stroke-width="3" d="M50 30 C30 30, 20 40, 20 60 C20 80, 30 90, 50 90 C70 90, 80 80, 80 60 C80 40, 70 30, 50 30Z"/>

        <!-- Top accent curve -->
        <path fill="none" stroke="#fff" stroke-width="3" d="M30 20 Q40 10, 50 20 Q60 30, 70 20"/>

        <!-- Static thinking dots -->
        <g id="thinkingDots">
          <circle cx="40" cy="55" r="5" fill="#000"></circle>
          <circle cx="50" cy="55" r="5" fill="#000"></circle>
          <circle cx="60" cy="55" r="5" fill="#000"></circle>
        </g>

        <!-- Bottom smile curve -->
        <path fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" d="M35 70 Q50 80, 65 70"/>
      </g>
    </svg>
  </span>
</button>


          </div>
        </header>

     <button class="btn btn-secondary navigation--link"
             id="menu-toggle"
             data-testid="menu-toggle-button"
             (click)="toggleMenu($event)">
     <svg class="expand-btn" width="24" height="24" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
         <path fill-rule="evenodd" clip-rule="evenodd" d="M115.583 37.911C121.155 31.0529 131.232 30.0104 138.09 35.5827L394.09 243.583C397.829 246.621 400.001 251.182 400.001 256.001C400.001 260.819 397.829 265.38 394.09 268.418L138.09 476.418C131.232 481.991 121.155 480.948 115.583 474.09C110.01 467.232 111.053 457.155 117.911 451.583L358.628 256.001L117.911 60.4183C111.053 54.8461 110.01 44.7692 115.583 37.911Z" fill="black"></path>
     </svg>

     <svg class="close-btn" width="24" height="24" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
         <path fill-rule="evenodd" clip-rule="evenodd" d="M396.417 37.911C390.845 31.0529 380.768 30.0104 373.91 35.5827L117.91 243.583C114.171 246.621 111.999 251.182 111.999 256.001C111.999 260.819 114.171 265.38 117.91 268.418L373.91 476.418C380.768 481.991 390.845 480.948 396.417 474.09C401.99 467.232 400.947 457.155 394.089 451.583L153.372 256.001L394.089 60.4183C400.947 54.8461 401.99 44.7692 396.417 37.911Z" fill="black"></path>
     </svg>
     </button>



    <div id="sidebar-wrapper" data-testid="sidebar-navigation">
        <ul class="sidebar-nav">
            <li>
                <a [routerLink]="['/movies', 'popular']" data-testid="sidebar-logo-link">
                    <picture style="text-align:center;" srcset="/assets/logo.svg"
                             media="(min-width: 80em)">
                        <img class="logo-img"
                             src="/assets/logo.svg"
                             title="Movies Tracker"
                             alt="MoviesTracker"
                             data-testid="sidebar-logo-image"
                             width="100"
                             style="display:inline-block"
                             height="100" />
                    </picture>
                </a>

                <a style="color: #efa21b; font-weight: 600;" class="navigation--link"
                    [routerLink]="['/movies', 'chatbot']"
                    routerLinkActive="active"
                    data-testid="nav-chatbot-search">Chatbot Search</a>

                <h3 class="navigation--headline lift-side-nave-separator-text" data-testid="categories-heading">Categories</h3>

                <a class="navigation--link"
                   [routerLink]="['/movies', 'favorite']"
                   routerLinkActive="active"
                   data-testid="nav-my-favorite">My Favorite</a>

                <a class="navigation--link"
                   [routerLink]="['/movies', 'popular']"
                   routerLinkActive="active"
                   data-testid="nav-popular">Popular</a>

                <a class="navigation--link"
                   [routerLink]="['/movies', 'top_rated']"
                   routerLinkActive="active"
                   data-testid="nav-top-rated">Top Rated</a>

                <a class="navigation--link"
                   [routerLink]="['/movies', 'upcoming']"
                   routerLinkActive="active"
                   data-testid="nav-upcoming">Upcoming</a>

            </li>
            <h3 class="navigation--headline lift-side-nave-separator-text" data-testid="genres-heading">Genres</h3>

            @if(genres(); as genres) {
                @for(genre of genres; track genre.id) {
                    <li>
                        <a class="navigation--link"
                        [routerLink]="['/movies', 'genre', genre.id]"
                        routerLinkActive="active">{{genre.name}}</a>
                    </li>
                }
            } @else {
                <p>Unable to fetch the genres</p>
            }
        </ul>
    </div>
    <div id="page-content-wrapper">
        <div class="container-fluid">
            <ng-content></ng-content>
        </div>
    </div>
    @if(loading()) {
        <div class="spinner"></div>
    }
    <div class="desktop-chatbox-button">              <button class="text-white rounded-lg hover:bg-gray-300" [routerLink]="['/movies', 'chatbot']">
      <span class="inline-block">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <g>
            <!-- Chat bubble body -->
            <path fill="#efa21b" stroke="#fff" stroke-width="3" d="M50 30 C30 30, 20 40, 20 60 C20 80, 30 90, 50 90 C70 90, 80 80, 80 60 C80 40, 70 30, 50 30Z"/>

            <!-- Top accent curve -->
            <path fill="none" stroke="#fff" stroke-width="3" d="M30 20 Q40 10, 50 20 Q60 30, 70 20"/>

            <!-- Static thinking dots -->
            <g id="thinkingDots">
              <circle cx="40" cy="55" r="5" fill="#000"></circle>
              <circle cx="50" cy="55" r="5" fill="#000"></circle>
              <circle cx="60" cy="55" r="5" fill="#000"></circle>
            </g>

            <!-- Bottom smile curve -->
            <path fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" d="M35 70 Q50 80, 65 70"/>
          </g>
        </svg>
      </span>
    </button></div>
</div>
