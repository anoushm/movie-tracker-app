<div id="wrapper"
     class="toggled">
    <div id="sidebar-wrapper">
        <ul class="sidebar-nav">
            <li>
                <a href="#">
                    <picture srcset="/assets/logo.svg"
                             media="(min-width: 80em)">
                        <img class="logo-img"
                             src="/assets/logo.svg"
                             title="Movies Tracker"
                             alt="MoviesTracker"
                             width="150"
                             height="150" />
                    </picture>
                </a>
            </li>
            @if(genres(); as genres) {
            @for(genre of genres; track genre.id) {
            <li>
                <a class="navigation--link"
                   [routerLink]="['/movies', 'genre', genre.id]"
                   routerLinkActive="active">{{genre.name}}</a>
            </li>
            }
            } @else {
            <p>Unable to fetch the genres</p>
            }
        </ul>
    </div>
    <div id="page-content-wrapper">
        <button class="btn btn-secondary navigation--link"
                id="menu-toggle"
                (click)="toggleMenu($event)">
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="24"
                 height="24"
                 fill="currentColor"
                 class="bi bi-list"
                 viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                      d="M2.5 11.5A.5.5 0 0 0 3 12h10a.5.5 0 0 0 0-1H3a.5.5 0 0 0-.5.5zm0-4A.5.5 0 0 0 3 8h10a.5.5 0 0 0 0-1H3a.5.5 0 0 0-.5.5zm0-4A.5.5 0 0 0 3 4h10a.5.5 0 0 0 0-1H3a.5.5 0 0 0-.5.5z" />
            </svg>
        </button>
        <div class="container-fluid">
            <ng-content></ng-content>
        </div>
    </div>
</div>
